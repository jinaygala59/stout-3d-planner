<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- THE STOUT MARK, cut from assets/brand/logo.png at the gutter that
       separates it from the wordmark (logo columns 0-241; the word STOUT
       starts at 307). The wordmark is not here on purpose: five letters
       across 16 pixels is a grey smear, and the mark alone is what a tab
       strip can actually show.
       THE PLATE IS NOT DECORATION. The artwork is WHITE on transparent,
       so on a light tab strip it would be invisible without something
       behind it; #121214 is the same plate the old "St" monogram stood
       on, so the tab keeps the chip it always had and only the glyph
       changes.
       52 of 64 was measured, not guessed: rasterised at 16/20/32 and
       magnified, 46 left the two droplets as faint smudges at 16px and
       58 ran the ribbon's tips into the rounded corners. -->
  <rect width="64" height="64" rx="12" fill="#121214"/>
  <image x="7.45" y="6.0" width="49.11" height="52.0"
         href="data:image/png;base64,"/>
</svg>
